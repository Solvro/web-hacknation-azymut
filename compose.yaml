services:
  azymut:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://azymut:${AZYMUT_POSTGRES_PASSWORD:?Set AZYMUT_POSTGRES_PASSWORD}@db:5432/azymut
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET}
      AZYMUT_DEMO_PASSWORD: ${AZYMUT_DEMO_PASSWORD:?Set AZYMUT_DEMO_PASSWORD}
      AZYMUT_MODEL_URL: ${AZYMUT_MODEL_URL:-}
      AZYMUT_MODEL_NAME: ${AZYMUT_MODEL_NAME:-}
      AZYMUT_DISABLE_REASONING: ${AZYMUT_DISABLE_REASONING:-0}
      AZYMUT_MODEL_TIMEOUT_MS: ${AZYMUT_MODEL_TIMEOUT_MS:-25000}
      AZYMUT_MODEL_TOKEN: ${AZYMUT_MODEL_TOKEN:-}
      AZYMUT_EMBED_URL: ${AZYMUT_EMBED_URL:-}
      AZYMUT_EMBED_NAME: ${AZYMUT_EMBED_NAME:-}
      AZYMUT_EMBED_TOKEN: ${AZYMUT_EMBED_TOKEN:-}
    volumes:
      - ./data:/app/data:ro
    ports:
      - "127.0.0.1:3000:3000"
  db:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_DB: azymut
      POSTGRES_USER: azymut
      POSTGRES_PASSWORD: ${AZYMUT_POSTGRES_PASSWORD:?Set AZYMUT_POSTGRES_PASSWORD}
    volumes:
      - azymut-db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U azymut -d azymut"]
      interval: 5s
      timeout: 3s
      retries: 12
volumes:
  azymut-db:
